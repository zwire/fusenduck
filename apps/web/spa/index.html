<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fusenduck</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <form id="open-form">
        <label for="path">Parquet file</label>
        <input id="path" name="path" type="text" autocomplete="off" spellcheck="false" placeholder="/path/to/file.parquet (or relative to the first root)" />
        <button id="open" type="submit">Open</button>
      </form>
      <div id="ref-panel" hidden>
        <div class="refbar">
          <label for="ref">Ref</label>
          <input id="ref" type="text" readonly />
          <button id="copy" type="button" title="Copy the Ref (Ctrl/⌘+C in the rows)">Copy</button>
        </div>
        <div class="bar">
          <p id="selection"></p>
          <button id="clear-selection" type="button" title="Select no rows (Esc in the rows)" hidden>Clear selection</button>
        </div>
      </div>
      <p id="status" role="status"></p>
    </header>
    <aside id="files-panel" hidden>
      <div class="files-bar">
        <input id="filter" type="search" autocomplete="off" spellcheck="false" placeholder="Filter files" aria-label="Filter files" aria-controls="files" />
        <button id="reload" type="button" title="List the files again">Reload</button>
      </div>
      <p id="files-note" class="note"></p>
      <ul id="files" role="listbox" aria-label="Parquet files under the roots"></ul>
    </aside>
    <main>
      <p id="hint" class="note"></p>
      <section id="card-section" hidden>
        <h2 id="source"></h2>
        <p id="source-dir" class="note"></p>
        <details id="card-details">
          <summary id="card-summary"></summary>
          <table id="card"></table>
          <p class="note">Untick a column to leave it out of the Ref. No row values are shown in the card. min/max of text columns are cut to 40 characters. approx_unique and avg are approximate.</p>
        </details>
      </section>
      <section id="rows-section" hidden>
        <form id="where-form" class="bar">
          <label for="where">Filter rows</label>
          <input id="where" name="where" type="text" autocomplete="off" spellcheck="false" aria-describedby="where-error" placeholder="SQL condition on the columns, e.g. amount > 100 AND region = 'south'" />
          <button type="submit">Apply</button>
          <button id="clear-where" type="button">Clear</button>
        </form>
        <p id="where-error" class="error" aria-live="polite"></p>
        <table id="rows" aria-label="Rows"></table>
        <nav>
          <button id="prev" type="button" title="Previous page (PageUp in the rows)">Previous</button>
          <span id="page"></span>
          <button id="next" type="button" title="Next page (PageDown in the rows)">Next</button>
        </nav>
        <p id="rows-note" class="note"></p>
      </section>
    </main>
  </body>
</html>
