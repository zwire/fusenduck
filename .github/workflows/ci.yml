name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # The supported platforms: package.json engines (Node >= 22.18) on the three OSes that
    # @duckdb/node-api ships native binaries for. Each job installs and loads that binary.
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      # Keep LF on Windows so the frozen Ref corpus and golden text compare byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contract:check
      - run: pnpm build

  bench:
    # Timing budgets are measured on one runner type only, so they stay comparable.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails when any number is over its budget in bench/budgets.json; the table goes to the job summary.
      - run: |
          set -o pipefail
          pnpm -s bench | tee -a "$GITHUB_STEP_SUMMARY"

  e2e:
    # The Web UI in a real Chromium (docs/adr/0002, acceptance tests). One platform: the browser
    # behaviour under test (CSP, clipboard, selection) does not depend on the OS.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm test:e2e
