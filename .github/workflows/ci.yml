name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request replaces the run in progress, so old runs stop holding runners.
# On main every push keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    # The supported platforms: package.json engines (Node >= 22.18) on the three OSes that
    # @duckdb/node-api ships native binaries for. Each job installs and loads that binary.
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      # Keep LF on Windows so the frozen Ref corpus and golden text compare byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The shipped DuckDB extensions, fetched against packages/core/extensions.lock.json (a hash that differs fails the job).
      - run: pnpm extensions:fetch
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contract:check
      - run: pnpm build

  bench:
    # Timing budgets are measured on one runner type only, so they stay comparable.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm extensions:fetch
      # Fails when any number is over its budget in bench/budgets.json; the table goes to the job summary.
      - run: |
          set -o pipefail
          pnpm -s bench | tee -a "$GITHUB_STEP_SUMMARY"

  e2e:
    # The Web UI in a real Chromium (docs/adr/0002, acceptance tests). One platform: the browser
    # behaviour under test (CSP, clipboard, selection) does not depend on the OS.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser download is cached by playwright-core's version; the apt step of --with-deps was
      # the slow and unpredictable part of this job (19 s on a good day, over 6 minutes on a bad one).
      - id: playwright
        run: echo "version=$(pnpm exec playwright-core --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright-core install chromium
      - run: pnpm test:e2e

  db-probe:
    # Observes how DuckDB's postgres extension behaves under the engine's lock (docs/adr/0005 section 6).
    # The probe reports; the Postgres source tests gate this job (no other job has a server to talk to).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: probe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FUSEN_PG_RO_PASSWORD: ro-secret-canary-7f3a
      FUSEN_PG_RW_PASSWORD: rw-secret-canary-91c2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the roles and a table
        env:
          PGPASSWORD: admin
        run: |
          psql -h 127.0.0.1 -U postgres -d probe -v ON_ERROR_STOP=1 <<SQL
          create table public.items as select g as id, 'item ' || g as name from generate_series(1, 100000) g;
          alter table public.items add primary key (id);
          create role fusen_ro login password '$FUSEN_PG_RO_PASSWORD';
          create role fusen_rw login password '$FUSEN_PG_RW_PASSWORD';
          grant select on public.items to fusen_ro;
          grant select, insert, update, delete on public.items to fusen_rw;
          grant create on schema public to fusen_rw;
          revoke create on schema public from public;
          SQL
      - run: node tests/integration/db-probe.ts
      # The shipped extension, fetched against the lock: fusenduck never downloads it while it runs (the probe above installs its own copy to observe DuckDB).
      - run: pnpm extensions:fetch
      - name: Postgres source tests
        env:
          FUSEN_PG_HOST: 127.0.0.1
          FUSEN_PG_PORT: "5432"
          FUSEN_PG_DB: probe
          FUSEN_PG_ADMIN_PASSWORD: admin
        run: pnpm exec vitest run tests/integration/postgres.test.ts

  mysql-probe:
    # Observes how DuckDB's mysql extension behaves under the engine's lock (docs/adr/0005). Reports only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_DATABASE: probe
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -padmin" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FUSEN_MY_RO_PASSWORD: ro-secret-canary-7f3a
      FUSEN_MY_RW_PASSWORD: rw-secret-canary-91c2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TEMPORARY: writes the mysql_scanner pins (the lock cannot be made where extensions.duckdb.org is unreachable).
      - run: pnpm extensions:lock && cat packages/core/extensions.lock.json
      - name: Create the roles and a table
        run: |
          mysql -h 127.0.0.1 -uroot -padmin --ssl-mode=DISABLED probe <<SQL
          set session cte_max_recursion_depth = 200000;
          create table items (id bigint primary key, name varchar(100));
          insert into items select n, concat('item ', n) from (with recursive s(n) as (select 1 union all select n + 1 from s where n < 100000) select n from s) t;
          create user 'fusen_ro'@'%' identified by '$FUSEN_MY_RO_PASSWORD';
          create user 'fusen_rw'@'%' identified by '$FUSEN_MY_RW_PASSWORD';
          grant select on probe.* to 'fusen_ro'@'%';
          grant select, insert, update, delete, create, drop on probe.* to 'fusen_rw'@'%';
          SQL
      - name: Copy the server's CA certificate
        run: docker cp "$(docker ps -q --filter ancestor=mysql:8.4 | head -1)":/var/lib/mysql/ca.pem "$RUNNER_TEMP/mysql-ca.pem"
      - run: node tests/integration/mysql-probe.ts
        env:
          FUSEN_MY_CA: ${{ runner.temp }}/mysql-ca.pem
      - run: pnpm extensions:fetch
      - name: MySQL source tests
        env:
          FUSEN_MY_HOST: 127.0.0.1
          FUSEN_MY_PORT: "3306"
          FUSEN_MY_DB: probe
          FUSEN_MY_ADMIN_PASSWORD: admin
          FUSEN_MY_CA: ${{ runner.temp }}/mysql-ca.pem
        run: pnpm exec vitest run tests/integration/mysql.test.ts
      - name: The mysql_scanner pins, on one line
        if: always()
        run: node -e "console.log('PINS ' + JSON.stringify(require('./packages/core/extensions.lock.json').mysql_scanner))"

  repro:
    # A clean clone of the commit installs from the lockfile, builds, and resolves the golden Refs
    # to the same text as this checkout (pnpm repro:check). The report goes to the job summary.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -s repro:check --out "$GITHUB_STEP_SUMMARY"

  vsix:
    # The VS Code extension as .vsix files, one per VS Code target (DuckDB is native). Each runner
    # packages its own target and loads the package (apps/vscode/smoke.ts), then packages the other
    # targets of its OS, whose DuckDB comes from the registry and is checked against pnpm-lock.yaml.
    # Those are built but not loaded here. The files are kept as the run's artifacts.
    name: vsix (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, also: linux-arm64 alpine-x64 alpine-arm64 }
          - { os: macos-latest, target: darwin-arm64, also: darwin-x64 }
          - { os: windows-latest, target: win32-x64, also: win32-arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fusenduck package --target ${{ matrix.target }}
      - run: node apps/vscode/smoke.ts apps/vscode/out/fusenduck-${{ matrix.target }}-*.vsix
      - run: for t in ${{ matrix.also }}; do pnpm --filter fusenduck package --target "$t"; done
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: apps/vscode/out/*.vsix
          retention-days: 14
